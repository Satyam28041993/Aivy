# Mobile-friendly: GitHub → Actions → Deploy Web → Run workflow
name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Also deploy Cloud Functions (needs Service Account User IAM — leave OFF for web-only)"
        type: boolean
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web (release)
        run: flutter build web --release --no-wasm-dry-run

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project aivy-5c031 --non-interactive

      # Optional. Functions need iam.serviceAccounts.ActAs on
      # aivy-5c031@appspot.gserviceaccount.com — without it this step fails.
      # continue-on-error so a Hosting success is not marked as a red Failure.
      - name: Build & deploy Functions (optional)
        if: ${{ inputs.deploy_functions }}
        continue-on-error: true
        id: functions
        working-directory: functions
        run: |
          npm ci
          npm run build
          firebase deploy --only functions --project aivy-5c031 --non-interactive

      - name: Note functions outcome
        if: ${{ inputs.deploy_functions && steps.functions.outcome == 'failure' }}
        run: |
          echo "::warning::Hosting deployed OK, but Functions deploy failed (usually missing Service Account User / iam.serviceAccounts.ActAs). Web app is still live."
