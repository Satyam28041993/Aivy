# Mobile-friendly: GitHub → Actions → Deploy Web → Run workflow
name: Deploy Web

on:
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: "Also deploy Cloud Functions (aivyVoiceAsk etc.)"
        type: boolean
        default: false

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # AIVY_RECAPTCHA_SITE_KEY turns on App Check for the web build. Without
      # it the app deliberately leaves App Check alone, because a half-set-up
      # App Check sends a dummy token and AI Logic closes the Live socket.
      # The site key is public (it ships in the page), so a repo variable is
      # the right home for it -- not a secret.
      - name: Build web (release)
        run: |
          flutter build web --release --no-wasm-dry-run \
            --dart-define=AIVY_RECAPTCHA_SITE_KEY="${{ vars.AIVY_RECAPTCHA_SITE_KEY }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project aivy-5c031 --non-interactive

      # Rules and indexes ship with the functions, not on their own switch: the
      # agent's pending-draft lookup is a composite query, so deploying the
      # functions without the index would leave it failing at runtime.
      - name: Deploy Firestore rules & indexes
        if: ${{ inputs.deploy_functions }}
        run: |
          firebase deploy --only firestore:rules,firestore:indexes \
            --project aivy-5c031 --non-interactive

      - name: Build & deploy Functions
        if: ${{ inputs.deploy_functions }}
        working-directory: functions
        run: |
          npm ci
          npm run build
          firebase deploy --only functions --project aivy-5c031 --non-interactive

      # The Firebase CLI only sets a callable's invoker policy when it *creates*
      # the function. These three were created by a deploy that could not set it,
      # so every later deploy is an update and silently leaves them private —
      # which the browser reports as a CORS failure, because the preflight is
      # rejected before it ever reaches the function. Applying the binding
      # directly is idempotent and fixes it without recreating anything.
      - name: Ensure agent callables are publicly invokable
        if: ${{ inputs.deploy_functions }}
        run: |
          for svc in aivyagent aivyagentcommit aivyagentchats; do
            echo "--- $svc"
            gcloud run services add-iam-policy-binding "$svc" \
              --region=us-central1 \
              --project=aivy-5c031 \
              --member=allUsers \
              --role=roles/run.invoker \
              --quiet
          done
