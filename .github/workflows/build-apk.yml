# Mobile-friendly: GitHub → Actions → Build APK → Run workflow
name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also attach the APK to a GitHub Release (easiest to install from a phone)"
        type: boolean
        default: true
  # workflow_dispatch only appears once this file is on the default branch, so
  # until then a build is kicked off by pushing an `apk-*` tag, or a branch
  # under `apk/` where tag pushes are not available.
  push:
    tags:
      - "apk-*"
    branches:
      - "apk/**"

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # The release build signs with the keystore checked into the repo
      # (android/app/build.gradle.kts), so every build carries the same SHA-1 and
      # the fingerprint registered in Firebase keeps working. Play Store upload
      # would need a real release keystore held in secrets.
      - name: Show signing SHA-1
        run: |
          keytool -list -v \
            -keystore android/app/aivy-debug.keystore \
            -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Name the APK
        id: name
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          tag="v${version%%+*}-build${GITHUB_RUN_NUMBER}"
          apk="aivy-${version%%+*}-build${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.apk }}
          path: ${{ steps.name.outputs.apk }}
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.name.outputs.tag }}" \
            "${{ steps.name.outputs.apk }}" \
            --title "${{ steps.name.outputs.tag }}" \
            --notes "APK built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          Signed with the repo's shared debug keystore, so Android will ask you
          to allow install from unknown sources. Builds before this one used a
          per-run key — uninstall any older Aivy build first." \
            --target "${GITHUB_SHA}"
